<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Persetujuan Uang Bongkar</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: white; max-width: 500px; width: 100%; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
    .icon { width: 70px; height: 70px; background-color: #007bff; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; margin: 0 auto 20px; }
    .icon.success { background-color: #28a745; }
    .icon.error { background-color: #dc3545; }
    h2 { color: #333; margin-bottom: 10px; font-size: 24px; }
    p { color: #666; font-size: 15px; line-height: 1.5; margin-bottom: 25px; }
    .info { background: #f8f9fa; padding: 18px; border-radius: 8px; text-align: left; font-size: 14px; border-left: 4px solid #007bff; margin-bottom: 20px; }
    .info.approved { background: #e9f7ef; border-left-color: #28a745; }
    .info div { margin-bottom: 8px; color: #2c3e50; }
    .info div:last-child { margin-bottom: 0; }
    .badge { background-color: #ffc107; color: #333; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge.approved { background-color: #28a745; color: white; }
    .btn-approve { background-color: #28a745; color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
    .btn-approve:hover { background-color: #218838; }
    .btn-approve:disabled { background-color: #6c757d; cursor: not-allowed; }
    .nav-btn { display: inline-block; margin-top: 25px; text-decoration: none; color: #007bff; font-weight: 600; font-size: 0.95rem; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDbJPyGVKR7D3ezqBYW-fwgYXvaBbCvbrY",
      authDomain: "logistics-track-fc336.firebaseapp.com",
      projectId: "logistics-track-fc336",
      storageBucket: "logistics-track-fc336.firebasestorage.app",
      messagingSenderId: "782653060704",
      appId: "1:782653060704:web:11f63ebebeddb7e6d0f505"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const docId = urlParams.get('docId');
    const ticket = urlParams.get('ticket') || '-';
    const customer = urlParams.get('customer') || '-';
    const biaya = urlParams.get('biaya') ? 'Rp ' + Number(urlParams.get('biaya')).toLocaleString('id-ID') : '-';
    const managerEmail = urlParams.get('manager') || 'Manager';

    // Persiapan Tampilan Awal
    async function initPage() {
      if (!docId) {
        showError('ID Dokumen tidak ditemukan!');
        return;
      }

      // Isikan data ke HTML
      document.getElementById('managerDisplay').innerText = managerEmail;
      document.getElementById('ticketDisplay').innerText = ticket;
      document.getElementById('customerDisplay').innerText = customer;
      document.getElementById('biayaDisplay').innerText = biaya;

      try {
        // Cek status saat ini di Firebase
        const docRef = doc(db, "uang_bongkar", docId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists() && docSnap.data().status === 'Approved') {
          showApprovedState();
        } else {
          // Tampilkan halaman konfirmasi jika belum di-approve
          document.getElementById('loadingState').style.display = 'none';
          document.getElementById('contentState').style.display = 'block';
        }
      } catch (err) {
        console.error(err);
        showError('Gagal mengambil data dari database: ' + err.message);
      }
    }

    // Fungsi saat tombol "Setujui" diklik manusia
    async function submitApproval() {
      const btn = document.getElementById('btnApprove');
      btn.disabled = true;
      btn.innerText = 'Memproses...';

      try {
        const docRef = doc(db, "uang_bongkar", docId);
        await updateDoc(docRef, {
          status: "Approved",
          approvedBy: managerEmail,
          approvedAt: new Date().toISOString()
        });

        showApprovedState();
      } catch (err) {
        console.error(err);
        showError('Gagal memperbarui status ke database: ' + err.message);
      }
    }

    function showApprovedState() {
      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('contentState').style.display = 'block';

      // Ubah UI menjadi status Sukses
      document.getElementById('mainIcon').className = 'icon success';
      document.getElementById('mainIcon').innerText = '✓';
      document.getElementById('mainTitle').innerText = 'Persetujuan Berhasil!';
      document.getElementById('mainSubtitle').innerText = 'Pengajuan uang bongkar ini telah berhasil disetujui.';
      document.getElementById('statusBadge').className = 'badge approved';
      document.getElementById('statusBadge').innerText = 'Approved';
      document.getElementById('infoContainer').className = 'info approved';
      document.getElementById('btnApprove').style.display = 'none';
    }

    function showError(msg) {
      document.getElementById('loadingState').style.display = 'none';
      const contentEl = document.getElementById('contentState');
      contentEl.innerHTML = `
        <div class="icon error">✕</div>
        <h2>Terjadi Kesalahan</h2>
        <p>${msg}</p>
        <a href="dashboard.html" class="nav-btn">📊 Kembali ke Dashboard</a>
      `;
      contentEl.style.display = 'block';
    }

    window.addEventListener('DOMContentLoaded', () => {
      initPage();
      document.getElementById('btnApprove').addEventListener('click', submitApproval);
    });
  </script>
</head>
<body>

<div class="card">
  <div id="loadingState">
    <div class="spinner"></div>
    <p>Memuat data pengajuan...</p>
  </div>

  <div id="contentState" style="display: none;">
    <div id="mainIcon" class="icon">?</div>
    <h2 id="mainTitle">Konfirmasi Persetujuan</h2>
    <p id="mainSubtitle">Mohon periksa rincian di bawah dan klik tombol di bawah untuk menyetujui pengajuan.</p>
    
    <div id="infoContainer" class="info">
      <div><strong>Status:</strong> <span id="statusBadge" class="badge">Pending</span></div>
      <div><strong>Approved By:</strong> <span id="managerDisplay" style="color: #007bff; font-weight: bold;">-</span></div>
      <div><strong>No. Ticket:</strong> <span id="ticketDisplay">-</span></div>
      <div><strong>Customer:</strong> <span id="customerDisplay">-</span></div>
      <div><strong>Biaya Bongkar:</strong> <span id="biayaDisplay">-</span></div>
    </div>

    <button id="btnApprove" class="btn-approve">✓ Setujui Pengajuan (Approve)</button>

    <div>
      <a href="dashboard.html" class="nav-btn">📊 Lihat Status di Dashboard →</a>
    </div>
  </div>
</div>

</body>
</html>
