<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Approval Uang Bongkar</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; padding: 20px; }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { margin-bottom: 20px; color: #333; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #f8f9fa; color: #555; }
    .badge { padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    .badge.Pending { background-color: #fff3cd; color: #856404; }
    .badge.Approved { background-color: #d4edda; color: #155724; }
    .nav-btn { display: inline-block; margin-bottom: 15px; text-decoration: none; color: #007bff; font-weight: 600; }
    
    /* Toolbar Filter & Controls */
    .table-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .filter-group input {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
    }
    .filter-group input:focus {
      border-color: #007bff;
    }
    
    /* Style Tombol Hapus */
    .btn-delete {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .btn-delete:hover { background-color: #bd2130; }
    
    /* Tombol Hapus Terpilih */
    .btn-delete-selected {
      background-color: #d9534f;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      display: none; /* Muncul jika ada centang */
    }
    .btn-delete-selected:hover { background-color: #c9302c; }

    /* Checkbox Alignment */
    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="nav-btn">← Kembali ke Form Input</a>
  <h1>Dashboard Uang Bongkar</h1>

  <div class="grid">
    <div class="card">
      <h3>Total Biaya per Transporter</h3>
      <table id="summaryTable">
        <thead>
          <tr>
            <th>Transporter</th>
            <th>Total Biaya</th>
            <th>Persentase</th>
          </tr>
        </thead>
        <tbody>
          <!-- Diisi via JS -->
        </tbody>
      </table>
    </div>

    <div class="card" style="display:flex; flex-direction:column; align-items:center;">
      <h3>Persentase Biaya Bongkar</h3>
      <div style="width: 280px; height: 280px;">
        <canvas id="percentageChart"></canvas>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Riwayat Transaksi Pengajuan</h3>

    <!-- Toolbar Filter, Search & Bulk Delete -->
    <div class="table-toolbar" style="margin-top: 15px;">
      <div class="filter-group">
        <input type="text" id="searchInput" placeholder="🔍 Cari Ticket/Customer/Transporter..." style="width: 250px;">
        <label style="font-size: 0.85rem; font-weight:600; color:#555;">Dari:</label>
        <input type="date" id="startDate">
        <label style="font-size: 0.85rem; font-weight:600; color:#555;">Sampai:</label>
        <input type="date" id="endDate">
      </div>
      <button id="btnDeleteSelected" class="btn-delete-selected" onclick="deleteSelectedData()">🗑️ Hapus Terpilih (<span id="selectedCount">0</span>)</button>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width: 40px; text-align: center;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
          <th>Tanggal</th>
          <th>Ticket</th>
          <th>Customer</th>
          <th>Transporter</th>
          <th>Biaya</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="dataTable">
        <!-- Diisi via JS -->
      </tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDbJPyGVKR7D3ezqBYW-fwgYXvaBbCvbrY",
    authDomain: "logistics-track-fc336.firebaseapp.com",
    projectId: "logistics-track-fc336",
    storageBucket: "logistics-track-fc336.firebasestorage.app",
    messagingSenderId: "782653060704",
    appId: "1:782653060704:web:11f63ebebeddb7e6d0f505"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let chartInstance = null;
  let rawDataList = []; // Menyimpan semua data dari Firebase

  // 1. Hapus Single Data
  window.deleteData = async function(docId, ticket) {
    if (confirm(`Apakah Anda yakin ingin menghapus transaksi Ticket #${ticket}?`)) {
      try {
        await deleteDoc(doc(db, "uang_bongkar", docId));
        alert("Data berhasil dihapus!");
      } catch (error) {
        console.error("Gagal menghapus data:", error);
        alert("Gagal menghapus data: " + error.message);
      }
    }
  };

  // 2. Multiple Checkbox Helpers
  window.toggleSelectAll = function(master) {
    const checkboxes = document.querySelectorAll('.row-checkbox');
    checkboxes.forEach(cb => cb.checked = master.checked);
    updateBulkDeleteButton();
  };

  window.updateBulkDeleteButton = function() {
    const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
    const btn = document.getElementById('btnDeleteSelected');
    const countSpan = document.getElementById('selectedCount');
    
    countSpan.innerText = checkedBoxes.length;
    if (checkedBoxes.length > 0) {
      btn.style.display = 'inline-block';
    } else {
      btn.style.display = 'none';
      document.getElementById('selectAll').checked = false;
    }
  };

  // 3. Bulk Delete
  window.deleteSelectedData = async function() {
    const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
    const count = checkedBoxes.length;

    if (count === 0) return;

    if (confirm(`Apakah Anda yakin ingin menghapus ${count} data terpilih sekaligus?`)) {
      try {
        for (const cb of checkedBoxes) {
          const docId = cb.value;
          await deleteDoc(doc(db, "uang_bongkar", docId));
        }
        alert(`${count} data berhasil dihapus!`);
        document.getElementById('selectAll').checked = false;
        updateBulkDeleteButton();
      } catch (error) {
        console.error("Gagal menghapus data masal:", error);
        alert("Gagal menghapus beberapa data: " + error.message);
      }
    }
  };

  // Listener Real-time Firebase
  onSnapshot(collection(db, "uang_bongkar"), (snapshot) => {
    rawDataList = [];
    snapshot.forEach((docSnapshot) => {
      const data = docSnapshot.data();
      rawDataList.push({ id: docSnapshot.id, ...data });
    });

    renderAll();
  });

  // Render & Filter Logic
  function renderAll() {
    const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
    const startDateVal = document.getElementById('startDate').value;
    const endDateVal = document.getElementById('endDate').value;

    // Filter Data
    const filteredData = rawDataList.filter(item => {
      // Filter Search Box
      const matchesSearch = !searchVal || 
        (item.noTicket && item.noTicket.toLowerCase().includes(searchVal)) ||
        (item.customer && item.customer.toLowerCase().includes(searchVal)) ||
        (item.transporter && item.transporter.toLowerCase().includes(searchVal));

      // Filter Date Range
      let matchesDate = true;
      if (startDateVal) {
        matchesDate = matchesDate && (item.tanggal >= startDateVal);
      }
      if (endDateVal) {
        matchesDate = matchesDate && (item.tanggal <= endDateVal);
      }

      return matchesSearch && matchesDate;
    });

    // Render Tabel Utama
    const dataTable = document.getElementById('dataTable');
    dataTable.innerHTML = filteredData.map(d => `
      <tr>
        <td style="text-align: center;">
          <input type="checkbox" class="row-checkbox" value="${d.id}" onclick="updateBulkDeleteButton()">
        </td>
        <td>${d.tanggal || '-'}</td>
        <td>${d.noTicket || '-'}</td>
        <td>${d.customer || '-'}</td>
        <td>${d.transporter || '-'}</td>
        <td>Rp ${d.biaya ? Number(d.biaya).toLocaleString('id-ID') : 0}</td>
        <td><span class="badge ${d.status}">${d.status}</span></td>
        <td>
          <button class="btn-delete" onclick="deleteData('${d.id}', '${d.noTicket}')">Hapus</button>
        </td>
      </tr>
    `).join('');

    // Hitung Ulang Summary & Chart berdasarkan Data Terfilter
    let totalsPerTransporter = {};
    let grandTotal = 0;

    filteredData.forEach(d => {
      const biaya = parseFloat(d.biaya) || 0;
      grandTotal += biaya;

      if (!totalsPerTransporter[d.transporter]) {
        totalsPerTransporter[d.transporter] = 0;
      }
      totalsPerTransporter[d.transporter] += biaya;
    });

    const summaryTable = document.getElementById('summaryTable').querySelector('tbody');
    summaryTable.innerHTML = '';

    const labels = [];
    const chartData = [];

    for (const [transporter, total] of Object.entries(totalsPerTransporter)) {
      const percentage = grandTotal > 0 ? ((total / grandTotal) * 100).toFixed(1) : 0;
      
      labels.push(transporter);
      chartData.push(total);

      summaryTable.innerHTML += `
        <tr>
          <td><b>${transporter}</b></td>
          <td>Rp ${total.toLocaleString('id-ID')}</td>
          <td><b>${percentage}%</b></td>
        </tr>
      `;
    }

    renderChart(labels, chartData);
    updateBulkDeleteButton();
  }

  // Render Chart Pie
  function renderChart(labels, data) {
    const ctx = document.getElementById('percentageChart').getContext('2d');
    
    if (chartInstance) {
      chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: labels,
        datasets: [{
          data: data,
          backgroundColor: ['#007bff', '#28a745', '#ffc107', '#dc3545', '#17a2b8', '#6c757d']
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });
  }

  // Event Listeners untuk Filter Real-time
  document.getElementById('searchInput').addEventListener('input', renderAll);
  document.getElementById('startDate').addEventListener('change', renderAll);
  document.getElementById('endDate').addEventListener('change', renderAll);
</script>

</body>
</html>
